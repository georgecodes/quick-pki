services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: quickpki
      POSTGRES_USER: quickpki
      POSTGRES_PASSWORD: quickpki
    ports:
      - "5433:5432"
    volumes:
      - quickpki-cert-api-postgres:/var/lib/postgresql/data

  cert-api:
    build:
      context: ..
      dockerfile: quick-pki-cert-api/Dockerfile
    environment:
      PORT: "8080"
      CERT_API_EXTERNAL_URL: http://localhost:8080
      CERT_API_CA_KEY_PASSWORD: change-this-development-password
      CERT_API_CERTIFICATE_DAYS: "90"
      JDBC_URL: jdbc:postgresql://postgres:5432/quickpki
      JDBC_USER: quickpki
      JDBC_PASSWORD: quickpki
      # Point these at your OAuth 2.0 authorization server. The introspection
      # endpoint must accept RFC 7662 requests; OAUTH_CLIENT_ID / SECRET are
      # this service's own confidential-client credentials for that endpoint.
      OAUTH_INTROSPECTION_URL: http://auth-server:8080/oauth2/introspect
      OAUTH_CLIENT_ID: quick-pki-cert-api
      OAUTH_CLIENT_SECRET: change-this-development-secret
      OAUTH_REQUIRED_SCOPE: certificates:issue
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  quickpki-cert-api-postgres:
