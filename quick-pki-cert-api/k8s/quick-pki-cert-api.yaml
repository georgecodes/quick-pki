apiVersion: v1
kind: Secret
metadata:
  name: quick-pki-cert-api
type: Opaque
stringData:
  JDBC_USER: quickpki
  JDBC_PASSWORD: quickpki
  CERT_API_CA_KEY_PASSWORD: change-this-before-use
  OAUTH_CLIENT_ID: quick-pki-cert-api
  OAUTH_CLIENT_SECRET: change-this-before-use
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quick-pki-cert-api
data:
  PORT: "8080"
  CERT_API_EXTERNAL_URL: "http://quick-pki-cert-api.default.svc.cluster.local:8080"
  CERT_API_CERTIFICATE_DAYS: "90"
  JDBC_URL: "jdbc:postgresql://quick-pki-postgres.default.svc.cluster.local:5432/quickpki"
  OAUTH_INTROSPECTION_URL: "http://auth-server.default.svc.cluster.local:8080/oauth2/introspect"
  OAUTH_REQUIRED_SCOPE: "certificates:issue"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quick-pki-cert-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quick-pki-cert-api
  template:
    metadata:
      labels:
        app: quick-pki-cert-api
    spec:
      containers:
        - name: quick-pki-cert-api
          image: quick-pki-cert-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: quick-pki-cert-api
            - secretRef:
                name: quick-pki-cert-api
          # Startup: covers the slow first boot (Liquibase migration and, on a
          # fresh database, issuing CA generation). Gives up to 60s before the
          # liveness probe takes over, so a slow start is never mistaken for a
          # hung process.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 12
          # Liveness: is the process still up? Dependency-free, so a database
          # outage never restarts the pod.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: can the pod serve traffic? Checks database reachability,
          # so a pod with a broken database is removed from the Service's
          # endpoints until it recovers — without a restart.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: quick-pki-cert-api
spec:
  selector:
    app: quick-pki-cert-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
