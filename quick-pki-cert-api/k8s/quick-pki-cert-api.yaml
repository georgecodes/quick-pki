apiVersion: v1
kind: Secret
metadata:
  name: quick-pki-cert-api
type: Opaque
stringData:
  JDBC_USER: quickpki
  JDBC_PASSWORD: quickpki
  CERT_API_CA_KEY_PASSWORD: change-this-before-use
  OAUTH_CLIENT_ID: quick-pki-cert-api
  OAUTH_CLIENT_SECRET: change-this-before-use
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quick-pki-cert-api
data:
  PORT: "8080"
  CERT_API_EXTERNAL_URL: "http://quick-pki-cert-api.default.svc.cluster.local:8080"
  CERT_API_CERTIFICATE_DAYS: "90"
  JDBC_URL: "jdbc:postgresql://quick-pki-postgres.default.svc.cluster.local:5432/quickpki"
  OAUTH_INTROSPECTION_URL: "http://auth-server.default.svc.cluster.local:8080/oauth2/introspect"
  OAUTH_REQUIRED_SCOPE: "certificates:issue"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quick-pki-cert-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quick-pki-cert-api
  template:
    metadata:
      labels:
        app: quick-pki-cert-api
    spec:
      containers:
        - name: quick-pki-cert-api
          image: quick-pki-cert-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: quick-pki-cert-api
            - secretRef:
                name: quick-pki-cert-api
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: quick-pki-cert-api
spec:
  selector:
    app: quick-pki-cert-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
