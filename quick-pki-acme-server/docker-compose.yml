services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: quickpki
      POSTGRES_USER: quickpki
      POSTGRES_PASSWORD: quickpki
    ports:
      - "5432:5432"
    volumes:
      - quickpki-postgres:/var/lib/postgresql/data

  acme:
    build:
      context: ..
      dockerfile: quick-pki-acme-server/Dockerfile
    environment:
      PORT: "8080"
      ACME_EXTERNAL_URL: http://localhost:8080
      ACME_ADMIN_TOKEN: change-this-development-admin-token
      ACME_CA_KEY_PASSWORD: change-this-development-password
      JDBC_URL: jdbc:postgresql://postgres:5432/quickpki
      JDBC_USER: quickpki
      JDBC_PASSWORD: quickpki
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  fakeid:
    image: georgemc/fakeid:0.1.0
    ports:
      - "8091:8091"

  admin:
    build:
      context: ..
      dockerfile: quick-pki-admin/Dockerfile
    environment:
      PORT: "8090"
      PUBLIC_URL: http://localhost:8090
      DATABASE_URL: postgres://quickpki:quickpki@postgres:5432/quickpki?sslmode=disable
      ACME_ADMIN_URL: http://acme:8080
      ACME_ADMIN_TOKEN: change-this-development-admin-token
      OIDC_ISSUER_PUBLIC: http://localhost:8091
      OIDC_ISSUER_INTERNAL: http://fakeid:8091
      OIDC_CLIENT_ID: quick-pki-admin
      OIDC_SCOPES: openid,profile,email
    ports:
      - "8090:8090"
    depends_on:
      - postgres
      - acme
      - fakeid

volumes:
  quickpki-postgres:
