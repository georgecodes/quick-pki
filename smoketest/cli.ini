# Certbot config pointing at the local quick-pki ACME server
# Usage: certbot --config ./cli.ini certonly ...

server = http://localhost:8080/acme/directory

email = you@example.com
agree-tos = true
no-eff-email = true

# Local-only smoketest: skip strict TLS validation against the dev server
no-verify-ssl = true

# Use the DNS-01 challenge via Cloudflare
authenticator = dns-cloudflare
dns-cloudflare-credentials = ./cloudflare.ini
dns-cloudflare-propagation-seconds = 30

# Keep all state inside this directory so we don't touch /etc/letsencrypt
config-dir = ./certbot/config
work-dir = ./certbot/work
logs-dir = ./certbot/logs
