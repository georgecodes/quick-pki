# Certbot config pointing at the local quick-pki ACME server (HTTP-01 variant)
# Usage: sudo certbot --config ./cli-http.ini certonly -d <hostname>
#
# HTTP-01 requires certbot to be reachable on port 80 at the domain being
# validated, so the ACME server can fetch the challenge token. Run with sudo
# (or as a user that can bind 80), or switch authenticator to `webroot` and
# point `webroot-path` at a directory served by an existing web server.

server = http://localhost:8080/acme/directory

email = you@example.com
agree-tos = true
no-eff-email = true

# Local-only smoketest: skip strict TLS validation against the dev server
no-verify-ssl = true

# Use the HTTP-01 challenge with certbot's built-in standalone server
authenticator = standalone
preferred-challenges = http

# Keep all state inside this directory so we don't touch /etc/letsencrypt
config-dir = ./certbot/config
work-dir = ./certbot/work
logs-dir = ./certbot/logs
