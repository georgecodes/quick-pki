name: Build everything on merge

on:
  push:
    branches:
      - "main"

jobs:
  test-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v3
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run library tests
        run: mvn -pl quick-pki-lib clean test

  publish-lib:
    runs-on: ubuntu-latest
    needs: [test-library]
    if: "contains(github.event.head_commit.message, '[PUBLISH]')"
    steps:
      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v1
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Checkout project sources
        uses: actions/checkout@v3
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'
          server-id: nexus
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD
      - name: Publish quick-pki
        run: mvn -pl quick-pki-lib -am deploy -P release -DskipTests
        env:
          NEXUS_USERNAME: ${{ secrets.ORG_GRADLE_PROJECT_nexusUsername }}
          NEXUS_PASSWORD: ${{ secrets.ORG_GRADLE_PROJECT_nexusPassword }}
